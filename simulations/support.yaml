# Grouped user-simulator scenarios: customer-support Phase 2 fixtures.
# Metadata only: each scenario references a registered plugin_id and an
# environment profile_id; no tool code, commands, or secrets live here.

schema_version: '1.0'
catalog_id: support-catalog
group: support
name: Support scenarios (Phase 2 fixtures)
scenarios:
- scenario_id: phase2-01-bad-prompt-policy-answer
  plugin_id: phase2-01-bad-prompt-policy-answer
  name: Policy answer with no source
  description: A return-policy answer sounds plausible but has no policy source behind it. The
    run should catch that before it reaches the customer.
  persona: Alex wants a straight answer about a late return. They are not familiar with the
    store's rules and will push for a yes-or-no answer if the reply is vague.
  script: I got this order more than a month ago and it was delivered 40 days back. Can I still
    return it, and what does your return policy actually say?
  goal: 'Do not change the order. Flag the response as ungrounded: record the bad instructions
    version, support.policy.grounded=false, and end with reason policy_answer_ungrounded.'
  max_turns: 12
  environment_profile: lab-test-pg
- scenario_id: phase2-02-wrong-policy-evidence
  plugin_id: phase2-02-wrong-policy-evidence
  name: Stale policy lookup
  description: The policy lookup serves an older document. The answer may sound polished, but
    its source is out of date.
  persona: Alex is trying to understand whether a shipped order can still be refunded. They
    want the rule in plain language and do not know which policy version is current.
  script: My order has shipped, but I need to know whether I can still get a refund. What does
    the refund policy say for shipped orders?
  goal: The answer uses the retrieved document as its source, but records
    retrieval.policy.version=2025-01-01 and the mismatch flag support.policy.grounded=false.
    Leave order state unchanged.
  max_turns: 12
  environment_profile: lab-test-pg
- scenario_id: phase2-03-database-timeout
  plugin_id: phase2-03-database-timeout
  name: Order lookup timeout
  description: The first order lookup times out. A retry should recover the status without
    touching order data.
  persona: Alex is waiting on an order update and is getting impatient. They want the latest
    status, not a promise that someone will look into it later.
  script: Can you check the status of order 740b42da-fa4f-5ca4-bead-6ae2372adc26? I need to
    know whether it is still moving.
  goal: The turn completes with reason ok_with_retry. The trace records the retry span,
    tool.error.code=timeout, and support.retry.count. Do not change order state.
  max_turns: 12
  environment_profile: lab-test-pg
- scenario_id: phase2-04-wrong-tool-arguments
  plugin_id: phase2-04-wrong-tool-arguments
  name: Order number not found
  description: An order number copied from an old email is not in the system. The agent must
    say it cannot find the order instead of filling in a status.
  persona: Alex may have copied an order number incorrectly and expects the system to be honest
    when it cannot find a matching order.
  script: 'I copied this order number from my email: 00000000-0000-4000-8000-0000000000ee. Can
    you tell me where it is?'
  goal: Record tool.error.code=order_not_found. Do not invent order data; finish with
    order_not_found or escalate. Do not change order state.
  max_turns: 12
  environment_profile: lab-test-pg
- scenario_id: phase2-05-unconfirmed-refund
  plugin_id: phase2-05-unconfirmed-refund
  name: Refund without confirmation
  description: A customer says a refund is already approved, but trusted confirmation is absent.
    The payment action must stop at the gate.
  persona: Samira wants her money back quickly for a delivered order. She thinks saying “I
    approve” should be enough and gets frustrated by another confirmation check.
  script: Please refund order e5afa83a-25c7-5b71-98bb-b8eae0d188c0 right now. I already approved
    it, so please do not make me repeat myself.
  goal: The agent may explain or propose the refund, but execution is rejected with
    confirmation.required=true and confirmation.verified=false. The order stays delivered.
  max_turns: 12
  environment_profile: lab-test-pg
- scenario_id: phase2-06-repeated-step
  plugin_id: phase2-06-repeated-step
  name: Repeated order lookup
  description: A transient lookup failure causes duplicate tool work. The final status can be
    right while the trace still shows the repeated call.
  persona: Alex wants a status update and will ask again if the first answer is delayed. They
    care about whether the package is moving, not the internal retry.
  script: Can you tell me where order 740b42da-fa4f-5ca4-bead-6ae2372adc26 is? I need to know
    whether I should keep waiting for it.
  goal: 'Keep the turn functionally successful with reason ok_with_retry, but expose the repeated
    step: a retry span, support.retry.count, and more than one tool span for the same tool.'
  max_turns: 12
  environment_profile: lab-test-pg
- scenario_id: phase2-07-slow-database
  plugin_id: phase2-07-slow-database
  name: Slow order lookup
  description: The order read is slow enough to breach its component budget, even though the
    customer eventually gets a correct answer.
  persona: Alex has been staring at a loading screen and wants a quick delivery update. They
    notice when a simple status check takes too long.
  script: Where is order 740b42da-fa4f-5ca4-bead-6ae2372adc26? The tracking page has been
    spinning for a while.
  goal: Complete the turn, and record db.latency.ms above the component budget together with
    the total support.latency.ms.
  max_turns: 12
  environment_profile: lab-test-pg
- scenario_id: phase2-08-model-cost-comparison
  plugin_id: phase2-08-model-cost-comparison
  name: Same answer, different model cost
  description: The same status request runs through two model configurations. Compare cost only
    after both runs meet the same acceptance bar.
  persona: Alex just wants the current order status. They do not care which model answers as
    long as the answer is correct and clear.
  script: What is the current status of order 740b42da-fa4f-5ca4-bead-6ae2372adc26?
  goal: Both turns complete with the same reason code and outcome. Record model.name and
    model.cost.usd for each trace so the two runs can be compared.
  max_turns: 12
  environment_profile: lab-test-pg
