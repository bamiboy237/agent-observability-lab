# Safe environment profiles for the user simulator (non-secret config only).
# Secret values are referenced by environment variable NAME (see
# required_variables / db_url_env) and resolved at runtime; credentials,
# API keys, and commands never appear in YAML.

schema_version: '1.0'
environments:
- profile_id: lab-test-pg
  label: PostgreSQL database (transaction rollback)
  environment: test
  loopback_only: false
  db_url_env: DATABASE_URL
  isolation_policy: transaction-rollback
  artifact_root: artifacts/user-simulator
  required_variables:
  - DATABASE_URL
  - MODEL_API_KEY
